<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로젝트 등록 | 대마 아카이브</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/project-form.css">
  <script type="module" src="../js/header.js"></script>
  <script type="module" src="../js/project-form.js"></script>
</head>
<body>
  <div id="header"></div>
  <main class="project-page">
    <h1 id="page-title">프로젝트 등록</h1>
    <p class="notice" id="page-notice">등록한 프로젝트는 관리자 승인 후 공개돼요.</p>

    <form id="project-form" class="project-form">
      <div class="form-row">
        <label for="project-name">프로젝트명 <span class="required">*</span></label>
        <input id="project-name" type="text" maxlength="100" placeholder="프로젝트명을 입력해 주세요" required>
      </div>
      <div class="form-row">
        <label for="summary">한 줄 소개 <span class="required">*</span></label>
        <div>
          <input id="summary" type="text" maxlength="200" placeholder="프로젝트를 한 문장으로 소개해 주세요" required>
          <p class="help">목록 카드에 표시돼요.</p>
        </div>
      </div>
      <div class="form-row">
        <label for="content">프로젝트 소개 <span class="required">*</span></label>
        <textarea id="content" rows="5" placeholder="프로젝트를 소개해 주세요" required></textarea>
      </div>
      <div class="form-row">
        <label for="tech-stack">기술 스택 <span class="required">*</span></label>
        <div>
          <div class="add-row">
            <input id="tech-stack" type="text" placeholder="기술 입력 후 추가">
            <button id="add-tech" class="blue-button" type="button">추가</button>
          </div>
          <p class="help">기술을 하나 이상 추가해 주세요.</p>
          <div id="tech-list" class="tech-list"></div>
        </div>
      </div>
      <div class="form-row">
        <span class="row-label">팀원 및 역할</span>
        <div>
          <div class="team-inputs">
            <label>회원 아이디<input id="member-id" type="text" placeholder="아이디 입력"></label>
            <label>역할<input id="member-role" type="text" placeholder="역할 입력"></label>
            <button id="add-member" class="outline-button" type="button">＋ 팀원 추가</button>
          </div>
          <table class="team-table">
            <thead><tr><th>아이디</th><th>역할</th><th>삭제</th></tr></thead>
            <tbody id="team-members"></tbody>
          </table>
        </div>
      </div>
      <div class="form-row">
        <label for="github">GitHub 링크</label>
        <input id="github" type="url" placeholder="https://github.com/">
      </div>
      <div class="form-row">
        <label for="presentation-date">발표 날짜</label>
        <input id="presentation-date" type="date">
      </div>
      <div class="form-row">
        <label for="reason">프로젝트 등록 사유 <span class="required">*</span></label>
        <div>
          <textarea id="reason" rows="2" placeholder="프로젝트를 등록하는 이유를 적어 주세요" required></textarea>
          <p class="help">관리자가 검토할 때 확인해요.</p>
        </div>
      </div>
      <div class="form-actions">
        <a href="index.html" class="cancel-link">취소</a>
        <button id="submit-button" class="blue-button" type="submit">검토 요청하기</button>
      </div>
      <p id="form-message" class="form-message"></p>
    </form>
  </main>
</body>
</html>
