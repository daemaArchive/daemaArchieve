<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 대마 아카이브</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/auth.css">
  <script type="module" src="../js/header.js"></script>
  <script type="module" src="../js/auth.js"></script>
</head>
<body>
  <div id="header"></div>
  <main class="auth-main login-main">
    <section class="auth-card login-card">
      <h1>로그인</h1>
      <p class="auth-intro">대마 아카이브에 오신 것을 환영해요</p>
      <form id="login-form" class="auth-form">
        <div class="form-field">
          <label for="login-email">이메일</label>
          <input id="login-email" type="email" placeholder="이메일을 입력하세요" required>
        </div>
        <div class="form-field">
          <label for="login-password">비밀번호</label>
          <input id="login-password" type="password" placeholder="비밀번호를 입력하세요" required>
        </div>
        <button class="auth-submit" type="submit">로그인</button>
        <p id="login-message" class="form-message"></p>
      </form>
      <p class="auth-switch">아직 계정이 없나요? <a href="signup.html">회원가입</a></p>
    </section>
  </main>
</body>
</html>
