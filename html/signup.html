<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | 대마 아카이브</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/auth.css">
  <script type="module" src="../js/header.js"></script>
  <script type="module" src="../js/auth.js"></script>
</head>
<body>
  <div id="header"></div>
  <main class="auth-main signup-main">
    <section class="auth-card signup-card">
      <h1>회원가입</h1>
      <form id="signup-form" class="auth-form">
        <div class="form-field">
          <label for="signup-name">이름</label>
          <input id="signup-name" type="text" placeholder="이름을 입력해주세요" required>
        </div>
        <div class="form-field">
          <label for="signup-id">아이디</label>
          <input id="signup-id" type="text" placeholder="아이디를 입력해주세요" required>
          <small>팀원 추가에 사용하는 고유 아이디예요</small>
        </div>
        <div class="form-field">
          <label for="signup-email">이메일</label>
          <input id="signup-email" type="email" placeholder="이메일을 입력해주세요" required>
        </div>
        <div class="form-field">
          <label for="signup-password">비밀번호</label>
          <input id="signup-password" type="password" placeholder="6자 이상 입력해주세요" required>
        </div>
        <div class="form-field">
          <label for="signup-password-confirm">비밀번호 확인</label>
          <input id="signup-password-confirm" type="password" placeholder="비밀번호를 다시 입력해주세요" required>
        </div>
        <button class="auth-submit" type="submit">회원가입</button>
        <p id="signup-message" class="form-message"></p>
      </form>
      <p class="auth-switch">이미 계정이 있나요? <a href="login.html">로그인</a></p>
    </section>
  </main>
</body>
</html>
