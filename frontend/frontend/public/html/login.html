<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 대마 아카이브</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/auth.css">
  <script src="../js/header.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>
<body>
  <div id="header"></div>
  <main class="auth-main login-main">
    <section class="auth-card login-card" aria-labelledby="login-title">
      <h1 id="login-title">로그인</h1>
      <p class="auth-intro">대마 아카이브에 오신 것을 환영해요</p>
      <form id="login-form" class="auth-form" method="post" novalidate>
        <div class="form-field">
          <label for="login-email">이메일</label>
          <input id="login-email" name="email" type="email" autocomplete="email" placeholder="이메일을 입력하세요" required>
        </div>
        <div class="form-field">
          <label for="login-password">비밀번호</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
        </div>
        <button class="auth-submit" type="submit" disabled>로그인</button>
        <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
        <button id="resend-email" class="auth-secondary" type="button" hidden>인증 메일 다시 보내기</button>
      </form>
      <noscript><p class="auth-note">화면을 사용하려면 JavaScript를 켜 주세요.</p></noscript>
      <p class="auth-switch">아직 계정이 없나요? <a href="./signup.html">회원가입</a></p>
    </section>
  </main>
</body>
</html>
