<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | 대마 아카이브</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/auth.css">
  <script src="../js/header.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>
<body>
  <div id="header"></div>
  <main class="auth-main signup-main">
    <section class="auth-card signup-card" aria-labelledby="signup-title">
      <h1 id="signup-title">회원가입</h1>
      <form id="signup-form" class="auth-form" method="post" novalidate>
        <div class="form-field">
          <label for="signup-name">이름</label>
          <input id="signup-name" name="name" type="text" autocomplete="name" placeholder="이름을 입력해주세요" required>
        </div>
        <div class="form-field">
          <label for="signup-id">아이디</label>
          <input id="signup-id" name="username" type="text" autocomplete="username" placeholder="아이디를 입력해주세요" required aria-describedby="id-help">
          <small id="id-help">팀원 추가에 사용하는 고유 아이디예요</small>
        </div>
        <div class="form-field">
          <label for="signup-email">이메일</label>
          <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="이메일을 입력해주세요" required>
        </div>
        <div class="form-field">
          <label for="signup-password">비밀번호</label>
          <input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="비밀번호를 입력해주세요" required>
        </div>
        <div class="form-field">
          <label for="signup-password-confirm">비밀번호 확인</label>
          <input id="signup-password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" placeholder="비밀번호를 다시 입력해주세요" required>
        </div>
        <button class="auth-submit" type="submit" disabled>인증 메일 보내기</button>
        <p id="signup-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <div class="auth-info">
        <span class="info-icon" aria-hidden="true">i</span>
        <p>메일의 인증 링크를 누르면 가입이 완료돼요.<br><small>인증 메일은 서버 연결 후 보낼 수 있어요.</small></p>
      </div>
      <noscript><p class="auth-note">화면을 사용하려면 JavaScript를 켜 주세요.</p></noscript>
      <p class="auth-switch">이미 계정이 있나요? <a href="./login.html">로그인</a></p>
    </section>
  </main>
</body>
</html>
